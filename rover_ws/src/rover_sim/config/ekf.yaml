ekf_odom:
  ros__parameters:
    use_sim_time: true
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # Fuse just the Gazebo odometry:
    odom0: /odom
    odom0_differential: false
    odom0_queue_size: 10
    # Don't reject measurements:
    reset_on_time_jump: true
    # Least surprise defaults:
    process_noise_covariance:
      - [1e-3, 0,    0,    0,    0,    0]
      - [0,    1e-3, 0,    0,    0,    0]
      - [0,    0,    1e3,  0,    0,    0]   # z unused in 2D
      - [0,    0,    0,    1e3,  0,    0]   # roll
      - [0,    0,    0,    0,    1e-3,0]   # pitch (or yaw depending on convention)
      - [0,    0,    0,    0,    0,    1e-3]
